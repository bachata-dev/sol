# Lint settings for sol. flake8 is the entry point because it bundles both
# checkers this code cares about — pyflakes for real faults, pycodestyle for
# layout — under one config:
#
#   python3 -m flake8 bin/sol bin/sol-menu bin/sol-spin tools/*.py
#
# The commands have no .py suffix, because they are commands rather than
# modules, so name them directly instead of expecting a glob to find them.

[flake8]
# 79 columns was chosen for punched cards, and this file is prose as much as
# code: the comments carry the reasoning, and rewrapping them narrower breaks
# paragraphs written to be read. 100 is where the code actually sits, with
# room for the handful of lines that genuinely need it.
max-line-length = 100

# E127/E128: continuation lines aligned into columns. Deliberate in the table
# of orbital elements, where the alignment is the point — it is what makes a
# wrong digit visible at a glance. Per-file, so the ordinary rules still hold
# everywhere else.
per-file-ignores =
    tools/sol-positions.py: E127,E128
