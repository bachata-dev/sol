# The ☉ menu — what the sun at the left of the bar opens, and what mod+tab
# brings up. Styled to match the bar and the canvas, so the menu arrives
# looking like part of the system it is steering rather than a stock dmenu
# dropped on top of it.
#
# Only `sol menu` uses this file; your own fuzzel config is left alone.

font=JetBrains Mono:size=11
line-height=23
prompt=sol ▸
width=46
horizontal-pad=22
vertical-pad=18
inner-pad=10
tabs=2
layer=overlay

[colors]
background=1a1b26f2
text=c0caf5ff
prompt=565f89ff
placeholder=565f89ff
input=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7aa2f7ff
border=414868cc

[border]
width=1
radius=12
