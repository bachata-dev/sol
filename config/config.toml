# sol — the driftwm canvas as our solar system.
#
# Sun at the origin; planets 1..8 outward in the order everyone knows.
# Distance from the Sun is distance from your attention: inner planets are
# immediate, the asteroid belt divides, outer planets are background.
#
#   mod+1..8  fly to a planet        mod+0  the Sun
#   mod+left/right  sunward/outward  mod+u  whole system
#   mod+tab   fly-to menu            mod+/  the keybinding card
#   mod+a     tidy this planet       mod+n/p  step through its windows
#   mod+e     the overview           (the whole system, named, on demand)
#   drag a window to another planet and it flies itself into that grid
#
# THE RULE THIS FILE ENFORCES: the camera moves only when you ask it to.
# Every automatic camera move driftwm offers is switched off below, and all
# navigation goes through `sol`, which interpolates the view at 90 Hz so it
# always travels and never jumps.

# New windows land under the cursor and do NOT drag the camera along.
window_placement = "cursor"

autostart = [
  "waybar -c ~/.config/driftwm/waybar.jsonc -s ~/.config/driftwm/waybar.css",
  # the footer: what sol last did, and the command line you can open over it
  "waybar -c ~/.config/driftwm/waybar-footer.jsonc -s ~/.config/driftwm/waybar.css",
  "mako",
  # catches windows you drag from one planet to another
  "sol watch",
  # planet name plates
  "foot -a planet-label-1 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=9aa5ce -e sh ~/.config/driftwm/label.sh 1 MERCURY quick",
  "foot -a planet-label-2 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=e0af68 -e sh ~/.config/driftwm/label.sh 2 VENUS comms",
  "foot -a planet-label-3 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=7aa2f7 -e sh ~/.config/driftwm/label.sh 3 EARTH home",
  "foot -a planet-label-4 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=f7768e -e sh ~/.config/driftwm/label.sh 4 MARS ops",
  "foot -a planet-label-5 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=ff9e64 -e sh ~/.config/driftwm/label.sh 5 JUPITER builds",
  "foot -a planet-label-6 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=e6cfa1 -e sh ~/.config/driftwm/label.sh 6 SATURN media",
  "foot -a planet-label-7 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=7dcfff -e sh ~/.config/driftwm/label.sh 7 URANUS spare",
  "foot -a planet-label-8 -o main.font='JetBrains Mono:size=20' -o colors.alpha=0.0 -o colors.foreground=5a7fd0 -e sh ~/.config/driftwm/label.sh 8 NEPTUNE archive",
  # a terminal on Earth, so the first thing you see is home
  "foot -c ~/.config/driftwm/foot.ini -a home-term",
]

# ── OPT-IN EXTRAS ─────────────────────────────────────────────────────────
# None of these run by default, because each one moves the camera without
# being asked. Add them to autostart above if you want them:
#
#   "sol-planetarium"   after 4 idle minutes, slowly orbits the system
#
# The circle gesture (draw a circle to cycle windows) is the systemd service
# sol-spin — enable with: sudo systemctl enable --now sol-spin
# It also stamps input activity, which is what the planetarium uses to tell
# real idleness from you simply not panning.

[session]
restore_camera = true

[navigation]
# `sol` owns the easing of every navigation flight, so driftwm only needs to
# follow the stream closely. Kept a little under 1.0 so driftwm's own moves
# (click-to-centre, fit, fullscreen) still ease instead of snapping.
camera_speed = 0.35
drift = 0.55
auto_navigate_on_close = false     # closing a window never moves the view
auto_navigate_on_click = false

[zoom]
reset_on_new_window = false        # a new window never yanks your zoom
reset_on_activation = false        # nor does an app asking for focus
# Below this zoom a window is too small to touch: click it to fly there.
interact_min = 0.45

[decorations]
bg_color = "#16161e"
fg_color = "#c0caf5"
corner_radius = 12
shadow = true
title_bar_height = 28
font = "JetBrains Mono"
font_size = 10
border_width = 2
border_color = "#292e42"
border_color_focused = "#7aa2f7"

[effects]
blur_radius = 3
blur_strength = 1.3
animate_blur_fps = 30
animation_speed = 0.35

[background]
type = "shader"
path = "~/.config/driftwm/sol.glsl"
animate_fps = 30

[keybindings]
# ── go ──
"mod+1" = "spawn sol goto 1"
"mod+2" = "spawn sol goto 2"
"mod+3" = "spawn sol goto 3"
"mod+4" = "spawn sol goto 4"
"mod+5" = "spawn sol goto 5"
"mod+6" = "spawn sol goto 6"
"mod+7" = "spawn sol goto 7"
"mod+8" = "spawn sol goto 8"
"mod+0" = "spawn sol goto sun"
"mod+left" = "spawn sol hop in"
"mod+right" = "spawn sol hop out"
"mod+u" = "spawn sol system"
"mod+tab" = "spawn sol menu go"     # the switcher: type a place, go
"mod+slash" = "spawn sol-help"
"mod+e" = "spawn sol-map"          # the overview: everything, named, on demand
"mod+semicolon" = "spawn sol-cmd"  # the command line, in the footer

# ── a crowded planet ──
# mod+a tidies the windows of wherever you are into a grid; mod+n / mod+p
# step through them one at a time, flying to each.
"mod+a" = "spawn sol arrange"
"mod+n" = "spawn sol next"
"mod+p" = "spawn sol prev"
# and move the focused window along the grid it is in
"mod+shift+left" = "spawn sol shift back"
"mod+shift+right" = "spawn sol shift forward"

# ── carry ──
"mod+ctrl+1" = "spawn sol send 1"
"mod+ctrl+2" = "spawn sol send 2"
"mod+ctrl+3" = "spawn sol send 3"
"mod+ctrl+4" = "spawn sol send 4"
"mod+ctrl+5" = "spawn sol send 5"
"mod+ctrl+6" = "spawn sol send 6"
"mod+ctrl+7" = "spawn sol send 7"
"mod+ctrl+8" = "spawn sol send 8"

# ── do ──
"mod+return" = "exec foot -c ~/.config/driftwm/foot.ini"
"mod+space" = "exec-launcher"
"mod+q" = "close-window"
"mod+f" = "toggle-fullscreen"
"mod+m" = "fit-window"
"mod+shift+c" = "reload-config"
"mod+l" = "spawn swaylock -f"

# ── media / system keys ──
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86MonBrightnessUp" = "spawn brightnessctl s +10%"
"XF86MonBrightnessDown" = "spawn brightnessctl s 10%-"
"Print" = "spawn grim - | wl-copy"
"shift+Print" = "spawn grim -g \"$(slurp -d)\" - | wl-copy"

# Optional Omarchy integration — no-ops when omarchy isn't installed.
"mod+k" = "spawn omarchy-menu-keybindings"
"mod+escape" = "spawn omarchy-menu system"

# On a window, sol binds nothing without a modifier: plain clicks belong to
# the app. Middle-click in particular is paste, and a workspace that steals
# paste to recenter the camera is trading a habit people have had for
# decades for a trick they never asked for.
[mouse.on-window]
"alt+left" = "move-window"
"alt+right" = "resize-window"

[mouse.on-canvas]
"left" = "pan-viewport"
# Right-click has meant "a menu about what is here" for as long as there have
# been desktops, so the ☉ menu opens with where you are and what you would do
# to it, before it offers anywhere else.
"right" = "spawn sol menu"
# And middle-click on the root has meant the window list since X11 had root
# menus — which is what the overview is: every window, named.
"middle" = "spawn sol-map"

# ── the trackpad ──────────────────────────────────────────────────────────
# Four fingers travel the system, borrowing the muscle memory everyone already
# has for switching desktops: swipe sideways to move between planets, up for
# the whole system, down for home. Three fingers still pan and two still zoom,
# so nothing you already do changes — this is only the layer that knows the
# canvas has places in it.
#
# driftwm has no double-click binding (triggers are left/right/middle and the
# scroll wheels), so the pointer equivalents live on right- and middle-click
# above rather than on a second click.
[gestures.anywhere]
"4-finger-swipe-left" = "spawn sol hop out"    # outward, away from the Sun
"4-finger-swipe-right" = "spawn sol hop in"    # sunward
"4-finger-swipe-up" = "spawn sol system"       # everything at once
"4-finger-swipe-down" = "spawn sol goto sun"   # and back to the middle
"4-finger-pinch-in" = "spawn sol system"       # pull back to the whole system
"4-finger-pinch-out" = "spawn sol dive"        # or drop into where you are
"4-finger-hold" = "spawn sol arrange"          # tidy this planet

# ── MACHINE-SPECIFIC: your display ────────────────────────────────────────
# Find the connector name under outputs.* in `driftwm msg state`.
# scale 2.0 suits a 4K panel around 22-27"; use 1.0 for a standard display.
[[outputs]]
name = "eDP-1"
scale = 2.0

[outputs.hot_corners]
top_left = "spawn sol system"

# ── windows ───────────────────────────────────────────────────────────────
[[window_rules]]
app_id = "foot"
blur = true

# The terminal that opens on Earth (home)
[[window_rules]]
app_id = "home-term"
position = [-471, 2553]
size = [1200, 720]

# Planet name plates. Deliberately NOT widgets: driftwm limits how far you can
# zoom out to half the fit of real windows, so the name plates are what make
# the whole-system view reachable on an otherwise empty canvas. They are also
# the click target for each planet once you are zoomed out past interact_min.
[[window_rules]]
app_id = "planet-label-*"
decoration = "none"
focus_on_open = false
size = [660, 78]

[[window_rules]]
app_id = "planet-label-1"
position = [789, 731]

[[window_rules]]
app_id = "planet-label-2"
position = [-1089, -1061]

[[window_rules]]
app_id = "planet-label-3"
position = [-471, 2953]

[[window_rules]]
app_id = "planet-label-4"
position = [-3202, 2407]

[[window_rules]]
app_id = "planet-label-5"
position = [-4344, -725]

[[window_rules]]
app_id = "planet-label-6"
position = [3789, 3546]

[[window_rules]]
app_id = "planet-label-7"
position = [1826, 6063]

[[window_rules]]
app_id = "planet-label-8"
position = [6634, 1290]

# The overview (mod+e). It used to be a 440x450 square parked bottom-right on
# every screen, which at that size could resolve neither a district nor a name.
# Now it is asked for, and it takes the room it needs to answer: full width, a
# card for every district, and a pane naming what the planet you picked holds.
# It takes focus on purpose — 1…8 fly, ⏎ drops you into the window you chose.
[[window_rules]]
app_id = "sol-map"
pinned_to_screen = true
position = [0, 0]
size = [1180, 960]
decoration = "minimal"
blur = true
border_width = 1
border_color = "#414868"
border_color_focused = "#414868"
corner_radius = 14

# The context menu. Deliberately NOT pinned: driftwm places a new window's
# top-left at the cursor, which is exactly where a menu belongs — and pinning
# would centre it instead, with no way to move it back. It carries no size
# here either, because `sol menu` sizes it against the current zoom so the
# same menu lands on screen whatever altitude you are at.
[[window_rules]]
app_id = "sol-menu"
decoration = "minimal"
blur = true
corner_radius = 8
border_width = 1
border_color = "#414868"
border_color_focused = "#414868"
shadow = true
# Born invisible. driftwm centres a new window on the cursor and sol then
# moves it beside the cursor instead — an animated move, so you would watch
# the menu slide out from under your pointer every time. It travels at zero
# opacity and fades in once it has arrived, which is how a menu should
# appear anyway.
opacity = 0.0

# The same menu, for when you are too far out for driftwm to let a canvas
# window take a click (see [zoom] interact_min). Pinned, so it is always its
# own size and always clickable — and centred, because a pinned window cannot
# be moved, and because there is no meaningful "here" when the pointer is over
# the whole solar system.
[[window_rules]]
app_id = "sol-menu-far"
pinned_to_screen = true
decoration = "minimal"
blur = true
corner_radius = 8
border_width = 1
border_color = "#414868"
border_color_focused = "#414868"
shadow = true
opacity = 0.0

# The command line, sitting just above the footer it belongs to.
[[window_rules]]
app_id = "sol-cmd"
pinned_to_screen = true
position = [0, -455]
size = [1500, 46]
decoration = "minimal"
blur = true
corner_radius = 10
border_width = 1
border_color = "#7aa2f7"
border_color_focused = "#7aa2f7"

# The keybinding card, centred and pinned while it is open
[[window_rules]]
app_id = "sol-help"
pinned_to_screen = true
position = [0, 0]
size = [920, 830]
decoration = "minimal"
blur = true
corner_radius = 14
border_width = 1
border_color = "#7aa2f7"
border_color_focused = "#7aa2f7"

[[window_rules]]
app_id = "waybar"
blur = true
