# Which portal backends sol's session uses.
#
# A portal is how a sandboxed or well-behaved application asks the desktop for
# something it cannot take for itself: share my screen, open a file, tell me
# whether you are in dark mode. The interface is standard and the
# implementation is per-desktop, so xdg-desktop-portal looks for a file named
# for XDG_CURRENT_DESKTOP — which `sol.desktop` sets to `sol`, which is why
# this file is called what it is.
#
# Without it, a desktop that is not KDE or GNOME gets whichever backend
# happens to be installed, or none, and the symptom is not an error: it is
# "Share screen" in a browser listing nothing at all, and a file dialog that
# takes four seconds to open. Naming the backend is the whole fix.
#
# wlr is the backend for wlroots-style compositors, which is what driftwm is
# built on — it implements screencast and screenshot over the same protocols
# driftwm already speaks. gtk fills in the rest: the file chooser, and the
# settings portal that tells applications which colour scheme to wear.
[preferred]
default=wlr;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
